<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatAI — Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-body">
    <div class="app-shell">
        <div id="app-nav"></div>

        <main class="chat-shell">
            <div class="chat-panel">
                <header class="chat-panel-header">
                    <div class="chat-doctor-avatar">🩺</div>
                    <div class="chat-panel-header-text">
                        <strong>SehatAI Assistant</strong>
                        <span class="chat-status"><span class="chat-status-dot"></span>Clinical AI Active</span>
                    </div>
                </header>

                <div id="chat-log" class="chat-log">
                    <p style="text-align:center; color: var(--color-text-muted); margin:auto 0; font-size:0.9rem;">
                        Loading your conversation…
                    </p>
                </div>
            </div>

            <div class="composer-wrap">
                <form id="composer" class="composer">
                    <textarea id="message-input" class="message-input" rows="1"
                        placeholder="Type your health query or symptoms here…" autocomplete="off"></textarea>
                    <button id="send-btn" type="submit" class="send-btn" aria-label="Send">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </form>
                <p class="composer-hint">SehatAI can make mistakes. For emergencies, call 1122 or go to the
                    nearest emergency room.</p>
            </div>
        </main>

        <div id="app-bottomnav"></div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/chat.js"></script>
</body>

</html>
