<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatAI — Patient Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="standalone-container">
    <div class="card auth-card">
        <header class="auth-header">
            <div class="brand-logo">
                <div class="brand-icon">S</div>
                <span class="brand-title">SehatAI</span>
            </div>
            <h2>Welcome Back</h2>
            <p>Log in to access your personal patient dashboard and records.</p>
        </header>

        <form id="login-form">
            <div id="form-status" class="form-status" role="alert" hidden></div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 12px;">Log In</button>
        </form>

        <p class="footer-note" style="text-align: center; margin-top: 24px; color: var(--color-text-muted);">
            New patient? <a href="register.html" class="inline-link">Create an account</a>
        </p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
