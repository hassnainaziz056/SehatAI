<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatAI — Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="card" role="main">
        <header class="card-header">
            <div class="wordmark">
                <span class="pulse-dot" aria-hidden="true"></span>
                <span class="wordmark-text">SehatAI</span>
            </div>
            <p class="tagline">Welcome back. Log in to pick up right where you left off.</p>

            <svg class="ecg-divider" viewBox="0 0 400 24" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0,12 L120,12 L136,12 L144,2 L156,22 L168,12 L180,12 L400,12" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </header>

        <form id="login-form" novalidate>
            <div id="form-status" class="form-status" role="alert" aria-live="polite" hidden></div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Log in</button>
        </form>

        <p class="footer-note">New here? <a href="register.html" class="inline-link">Create an account</a></p>
    </main>

    <script src="js/login.js"></script>
</body>

</html>
