<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatAI — My Health Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Header Top Bar -->
            <header class="top-bar">
                <div class="page-title-group">
                    <h1>My Health Profile</h1>
                    <p>Manage your patient file, medical history, and emergency details</p>
                </div>

                <div class="top-bar-actions">
                    <button id="toggle-edit-btn" class="btn btn-primary" onclick="toggleProfileEdit()">Edit
                        Profile</button>
                    <button class="btn-icon" title="Logout" onclick="handleLogout()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </header>

            <main class="content-container">
                <div id="profile-status" class="form-status" hidden role="alert" style="margin-bottom: 20px;"></div>

                <form id="profile-form">
                    <div class="grid-2">
                        <!-- Card 1: Vitals & Personal Info -->
                        <div class="card">
                            <h3 class="card-title" style="margin-bottom: 20px;">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                Personal Vitals
                            </h3>

                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="prof-age">Age (years)</label>
                                    <input type="number" id="prof-age" class="form-control" disabled>
                                </div>
                                <div class="form-group">
                                    <label for="prof-gender">Gender</label>
                                    <select id="prof-gender" class="form-control" disabled>
                                        <option value="">Not set</option>
                                        <option value="Female">Female</option>
                                        <option value="Male">Male</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid-3">
                                <div class="form-group">
                                    <label for="prof-height">Height (cm)</label>
                                    <input type="number" id="prof-height" class="form-control" disabled>
                                </div>
                                <div class="form-group">
                                    <label for="prof-weight">Weight (kg)</label>
                                    <input type="number" id="prof-weight" class="form-control" disabled>
                                </div>
                                <div class="form-group">
                                    <label for="prof-blood">Blood Group</label>
                                    <select id="prof-blood" class="form-control" disabled>
                                        <option value="">Unknown</option>
                                        <option>A+</option>
                                        <option>A-</option>
                                        <option>B+</option>
                                        <option>B-</option>
                                        <option>AB+</option>
                                        <option>AB-</option>
                                        <option>O+</option>
                                        <option>O-</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="prof-smoking">Smoking Status</label>
                                    <select id="prof-smoking" class="form-control" disabled>
                                        <option value="Never smoked">Never smoked</option>
                                        <option value="Former smoker">Former smoker</option>
                                        <option value="Current smoker">Current smoker</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="prof-alcohol">Alcohol Status</label>
                                    <select id="prof-alcohol" class="form-control" disabled>
                                        <option value="Never">Never</option>
                                        <option value="Occasional">Occasional</option>
                                        <option value="Regular">Regular</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Card 2: Emergency Contact -->
                        <div class="card">
                            <h3 class="card-title" style="margin-bottom: 20px;">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                </svg>
                                Emergency Contact
                            </h3>

                            <div class="form-group">
                                <label for="prof-emergency-name">Contact Full Name</label>
                                <input type="text" id="prof-emergency-name" class="form-control" disabled>
                            </div>

                            <div class="form-group">
                                <label for="prof-emergency-phone">Contact Phone Number</label>
                                <input type="tel" id="prof-emergency-phone" class="form-control" disabled>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3: Medical Notes & History -->
                    <div class="card" style="margin-top: 24px;">
                        <h3 class="card-title" style="margin-bottom: 20px;">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            Medical History & Allergies
                        </h3>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="prof-allergies">Allergies</label>
                                <textarea id="prof-allergies" class="form-control" rows="3" disabled></textarea>
                            </div>
                            <div class="form-group">
                                <label for="prof-surgeries">Past Surgeries</label>
                                <textarea id="prof-surgeries" class="form-control" rows="3" disabled></textarea>
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label for="prof-family">Family Medical History</label>
                                <textarea id="prof-family" class="form-control" rows="3" disabled></textarea>
                            </div>
                            <div class="form-group">
                                <label for="prof-medical-history">Other Medical Notes</label>
                                <textarea id="prof-medical-history" class="form-control" rows="3" disabled></textarea>
                            </div>
                        </div>

                        <div id="save-profile-bar"
                            style="display: none; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-border);">
                            <button type="button" class="btn btn-secondary"
                                onclick="toggleProfileEdit(false)">Cancel</button>
                            <button type="submit" id="save-profile-btn" class="btn btn-primary">Save Profile
                                Changes</button>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
