<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatAI — Medicines & Dosage Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Header Top Bar -->
            <header class="top-bar">
                <div class="page-title-group">
                    <h1>Medicines & Dosage Tracker</h1>
                    <p>Manage active prescriptions, daily schedules, and log taken doses</p>
                </div>

                <div class="top-bar-actions">
                    <button class="btn btn-primary" onclick="openAddMedModal()">+ Add New Medicine</button>
                    <button class="btn-icon" title="Logout" onclick="handleLogout()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </header>

            <main class="content-container">
                <div id="meds-status" class="form-status" hidden role="alert" style="margin-bottom: 20px;"></div>

                <!-- Active Medications Section -->
                <div class="card" style="margin-bottom: 28px;">
                    <div class="card-header-flex">
                        <h3 class="card-title">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L5.6 15.12a2 2 0 00-1.022.547l-1.166 1.167a2 2 0 000 2.828l.828.829a2 2 0 002.828 0l1.167-1.167zM9 9a3 3 0 100-6 3 3 0 000 6z" />
                            </svg>
                            My Prescription List
                        </h3>
                    </div>

                    <div id="meds-grid" class="grid-2">
                        <p style="color: var(--color-text-muted);">Loading medicines...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Medicine Modal -->
    <div id="med-modal" class="standalone-container"
        style="position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; padding: 20px;">
        <div class="card" style="max-width: 520px; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 id="modal-title" style="font-weight: 700;">Add New Medicine</h3>
                <button type="button" class="btn-icon" onclick="closeMedModal()">&times;</button>
            </div>

            <form id="med-form">
                <input type="hidden" id="med-id">

                <div class="form-group">
                    <label for="med-name">Medicine Name *</label>
                    <input type="text" id="med-name" class="form-control" placeholder="e.g. Metformin" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="med-dosage">Dosage</label>
                        <input type="text" id="med-dosage" class="form-control" placeholder="e.g. 500mg">
                    </div>
                    <div class="form-group">
                        <label for="med-frequency">Frequency</label>
                        <input type="text" id="med-frequency" class="form-control" placeholder="e.g. Twice daily">
                    </div>
                </div>

                <div class="form-group">
                    <label for="med-start-date">Start Date</label>
                    <input type="date" id="med-start-date" class="form-control">
                </div>

                <div class="form-group">
                    <label>Time of Day Schedule</label>
                    <div class="med-slot-picker">
                        <label class="slot-chip"><input type="checkbox" id="slot-morning"> Morning</label>
                        <label class="slot-chip"><input type="checkbox" id="slot-afternoon"> Afternoon</label>
                        <label class="slot-chip"><input type="checkbox" id="slot-night"> Night</label>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" onclick="closeMedModal()">Cancel</button>
                    <button type="submit" id="save-med-btn" class="btn btn-primary">Save Medicine</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/medicines.js"></script>
</body>

</html>
